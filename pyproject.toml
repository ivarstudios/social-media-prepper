[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ivar-smp"
version = "0.1.0"
description = "IVAR SMP (Social Media Prepper): brief-aware AI metadata for finished images, written into the files"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10.3",
  "pillow-heif>=0.16",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["smp"]

[tool.setuptools.package-data]
smp = ["static/*", "smp.exiftool.config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
